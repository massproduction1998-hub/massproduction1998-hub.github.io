<title>Визитка Натали</title>

<style>
  :root{
    --ground:#F1EBDF;
    --surface:#FCFAF5;
    --ink:#17150F;
    --muted:#6D6558;
    --line:#17150F1F;
    --accent:#2D3BC4;
    --on-accent:#FCFAF5;
    --grain:#17150F0A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#131109;
      --surface:#1D1A12;
      --ink:#F1EBDF;
      --muted:#9A9083;
      --line:#F1EBDF24;
      --accent:#96A0FF;
      --on-accent:#0F0D07;
      --grain:#F1EBDF08;
    }
  }
  :root[data-theme="dark"]{
    --ground:#131109;
    --surface:#1D1A12;
    --ink:#F1EBDF;
    --muted:#9A9083;
    --line:#F1EBDF24;
    --accent:#96A0FF;
    --on-accent:#0F0D07;
    --grain:#F1EBDF08;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    background-image:
      radial-gradient(var(--grain) 1px, transparent 1px),
      radial-gradient(var(--grain) 1px, transparent 1px);
    background-size:7px 7px, 11px 11px;
    background-position:0 0, 3px 4px;
    color:var(--ink);
    font-family:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:44px 20px;
    min-height:100vh;
  }
  .card{width:100%;max-width:372px;display:flex;flex-direction:column;gap:26px}

  .top{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .ava{
    width:104px;height:104px;border-radius:50%;object-fit:cover;
    border:2px solid var(--ink);
    box-shadow:0 0 0 5px var(--ground);
    display:block;
  }
  h1{
    font-family:"Unbounded","Golos Text",sans-serif;
    font-weight:800;font-size:34px;line-height:1;letter-spacing:-0.02em;
    margin:0;text-wrap:balance;
  }
  .tagline{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:30ch}

  .links{display:flex;flex-direction:column;gap:10px}
  .link{
    display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:3px;
    color:inherit;text-decoration:none;
    transition:background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
  }
  .mark{
    width:44px;height:44px;display:grid;place-items:center;
    background:var(--ink);color:var(--ground);
    font-family:"Unbounded","Golos Text",sans-serif;
    font-weight:600;font-size:13px;letter-spacing:0.01em;
    transition:background .16s ease, color .16s ease;
  }
  .mark.sm{font-size:11px}
  .names{display:flex;flex-direction:column;gap:2px;min-width:0}
  .name{font-weight:600;font-size:16px;line-height:1.2}
  .handle{
    font-size:12.5px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:color .16s ease;
  }
  .arrow{font-size:17px;color:var(--muted);transition:color .16s ease, transform .16s ease}

  .link:hover,.link:focus-visible{
    background:var(--accent);border-color:var(--accent);color:var(--on-accent);
    transform:translateY(-1px);
  }
  .link:hover .mark,.link:focus-visible .mark{background:var(--on-accent);color:var(--accent)}
  .link:hover .handle,.link:hover .arrow,
  .link:focus-visible .handle,.link:focus-visible .arrow{color:var(--on-accent)}
  .link:hover .arrow,.link:focus-visible .arrow{transform:translateX(3px)}
  .link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .link:active{transform:translateY(0)}

  footer{
    display:flex;align-items:center;gap:10px;
    color:var(--muted);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
  }
  footer::before,footer::after{content:"";height:1px;background:var(--line);flex:1}

  @media (prefers-reduced-motion: reduce){
    .link,.mark,.arrow,.handle{transition:none}
    .link:hover,.link:focus-visible{transform:none}
    .link:hover .arrow,.link:focus-visible .arrow{transform:none}
  }
</style>
